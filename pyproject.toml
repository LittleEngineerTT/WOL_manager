[project]
name = "wol-bot"
version = "2.1.0"
description = "Telegram bot to wake devices on the local network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt==2.5.1",
    "python-telegram-bot==22.8",
    "wakeonlan==4.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
